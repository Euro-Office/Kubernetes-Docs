name: lint

run-name: >
   Tests on PR: "${{ github.event.pull_request.title }}" by @${{ github.actor }}

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '**/README.md'
      - '**/CHANGELOG.md'
      - '**/LICENSE'

  workflow_dispatch:
    inputs:
      kubernetes_version:
        description: 'Choose k8s version (example v1.22)'
        type: string
        required: true

jobs:
  lint-chart:           
    name: lint chart ${{ github.event.repository.name }}
    uses: ./.github/workflows/reusable-helm-lint.yaml
    with: 
      ct_version: 3.15.0
      enable_yaml_lint: true
      enable_kube_lint: true

  validate-manifests:
    name: "k8s manifests api validation"
    uses: ./.github/workflows/reusable-validate-manifests.yaml
    with:
      manual_k8s: ${{ github.event.inputs.kubernetes_version }}
      set_keys: |
              "--set grafana.enabled=true \
               --set grafana.dashboard.enabled=true \
               --set example.enabled=true \
               --set proxy.welcomePage.enabled=true \
               --set docservice.autoscaling.enabled=true \
               --set converter.autoscaling.enabled=true \
               --set ingress.enabled=true \
               --set serviceAccount.create=true"

  chart-unit-tests:
    name: "chart unit tests and entrypoint contract"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout chart
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.22.1'

      # redis-py of the tests image (ghcr.io/euro-office/cluster-utils) is not known
      # from this repository: 6.4.0 is the newest 6.x that test_ds_tls.py passes with.
      - name: Install test dependencies
        run: python3 -m pip install pyyaml redis==6.4.0

      - name: Rendering and connectivity-hook unit tests
        run: |
          python3 -I sources/scripts/test_redis_rendering.py
          python3 -I sources/scripts/test_ds_tls.py

      # Pinned DocumentServer commit (main on 2026-11-26, contains
      # build/scripts/redis-topology.sh): the PR check must not change when
      # DocumentServer main changes. The weekly entrypoint-drift workflow checks
      # main; move this pin forward when that run shows a needed change.
      - name: Checkout DocumentServer entrypoint scripts
        uses: actions/checkout@v7
        with:
          repository: Euro-Office/DocumentServer
          ref: 825f931d59a0c309cffd17b4fa572bda4bff3317
          sparse-checkout: build/scripts
          path: ds
          persist-credentials: false

      - name: Entrypoint contract
        run: python3 -I tests/entrypoint_contract.py --ds-scripts ds/build/scripts
