# TLS for the demo Redis Sentinel or Redis Cluster test install.
# Apply AFTER my-values.yml and one topology overlay, once redis-tls-certs.yaml has
# issued the Secret redis-tls and the Redis pods run in TLS mode (see Readme.md):
#
# helm install docs .. -n euro-office -f my-values.yml -f my-values.redis-sentinel.yml -f my-values.redis-tls.yml
# helm install docs .. -n euro-office -f my-values.yml -f my-values.redis-cluster.yml -f my-values.redis-tls.yml

connections:
  # TLS to the Redis data nodes (Sentinel-discovered nodes and Cluster nodes).
  redisTLS: true
  # TLS to the Sentinels. Used only with my-values.redis-sentinel.yml: it has no
  # effect with the Cluster overlay.
  redisSentinelTLS: true
  # The Secret redis-tls (issued by cert-manager, see redis-tls-certs.yaml) holds the
  # test CA as ca.crt, the chart default redisCASecretKeyName. The chart mounts only
  # that one item into DocService, AdminPanel and the test Pods, so the server private
  # key (tls.key) in the same Secret is not mounted there. The CA is trusted through
  # NODE_EXTRA_CA_CERTS; the Converter does not use Redis and gets neither.
  redisCAExistingSecret: redis-tls
