apiVersion: v1
kind: Secret
metadata:
  name: rabbit-rabbitmq
  namespace: euro-office
type: Opaque
stringData:
  rabbitmq-password: rabbit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbit-rabbitmq
  namespace: euro-office
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbit-rabbitmq
  template:
    metadata:
      labels:
        app: rabbit-rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-management
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: eurooffice
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: rabbit-rabbitmq
              key: rabbitmq-password
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "ping"]
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 1Gi
            cpu: 1000m
---
apiVersion: v1
kind: Service
metadata:
  name: rabbit-rabbitmq
  namespace: euro-office
spec:
  selector:
    app: rabbit-rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672