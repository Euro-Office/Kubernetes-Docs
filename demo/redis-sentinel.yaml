# Redis Sentinel test install: 2 Redis nodes (primary + replica) and 3 Sentinels.
# It mirrors develop/docker-compose.redis-sentinel.yml of Euro-Office/DocumentServer
# (without TLS), adapted to Kubernetes. For QA only: no persistence, no PVCs.
#
# Image: valkey/valkey 8.1.12-alpine. It ships redis-server and redis-cli as
# symlinks to valkey-server and valkey-cli, so the redis-* names are used below.
# redis:7.4-alpine works as a drop-in replacement (same flags): change the three
# `image:` lines, nothing else.
#
# Use with: helm install ... -f my-values.yml -f my-values.redis-sentinel.yml
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-sentinel-auth
  namespace: euro-office
type: Opaque
stringData:
  # Password of the Redis nodes (requirepass / masterauth).
  redis-password: redis
  # Password of the Sentinels. Empty (default) = Sentinel without authentication.
  # To enable it set a value here, then in my-values.redis-sentinel.yml enable the
  # commented "Sentinel authentication" lines. Use only letters and digits: the
  # value is written unquoted into sentinel.conf.
  sentinel-password: ""
  # Named Sentinel ACL user. Empty (default) = only the Sentinel password is used
  # (the default user). It takes effect only together with sentinel-password.
  # The user gets the minimal rights of a Sentinel client, see below.
  sentinel-user: ""
---
# Headless Service of the Redis nodes. publishNotReadyAddresses lets the pods
# resolve each other before they are Ready (a replica must reach its primary).
apiVersion: v1
kind: Service
metadata:
  name: redis-node
  namespace: euro-office
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: redis-node
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-node
  namespace: euro-office
spec:
  serviceName: redis-node
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: redis-node
  template:
    metadata:
      labels:
        app: redis-node
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: redis
        image: valkey/valkey:8.1.12-alpine
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-sentinel-auth
              key: redis-password
        - name: SENTINEL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-sentinel-auth
              key: sentinel-password
        command:
        - sh
        - -c
        - |
          set -eu
          ns="$POD_NAMESPACE"
          fqdn="$HOSTNAME.redis-node.$ns.svc.cluster.local"
          ordinal="${HOSTNAME##*-}"

          # Ask one Sentinel for the current primary. Prints the host, or nothing.
          ask_sentinel() {
            if [ -n "$SENTINEL_PASSWORD" ]; then
              REDISCLI_AUTH="$SENTINEL_PASSWORD" timeout 3 redis-cli \
                -h "$1" -p 26379 SENTINEL get-master-addr-by-name mymaster 2>/dev/null | head -n 1
            else
              timeout 3 redis-cli -h "$1" -p 26379 SENTINEL get-master-addr-by-name mymaster 2>/dev/null | head -n 1
            fi
          }

          # 1) The Sentinels know which node is the primary now. After a failover a
          #    restarted former primary must join as a replica of the new one, never
          #    start as a second primary (split brain).
          primary=""
          for i in 0 1 2; do
            primary="$(ask_sentinel "redis-sentinel-$i.redis-sentinel.$ns.svc.cluster.local" || true)"
            [ -n "$primary" ] && break
          done

          # 2) No Sentinel answers (first start): ordinal 0 is the primary.
          if [ -z "$primary" ]; then
            if [ "$ordinal" = "0" ]; then primary="$fqdn"; else primary="redis-node-0.redis-node.$ns.svc.cluster.local"; fi
          fi

          if [ "$primary" = "$fqdn" ]; then
            echo "starting $fqdn as primary"
            set --
          else
            echo "starting $fqdn as replica of $primary"
            set -- --replicaof "$primary" 6379
          fi
          exec redis-server "$@" \
            --bind 0.0.0.0 --protected-mode no --port 6379 \
            --appendonly no --save "" --dir /data \
            --requirepass "$REDIS_PASSWORD" --masterauth "$REDIS_PASSWORD" \
            --replica-announce-ip "$fqdn"
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          exec:
            command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli -h 127.0.0.1 ping | grep -q PONG"]
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 500m
      volumes:
      - name: data
        emptyDir: {}
---
# Headless Service of the Sentinels.
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: euro-office
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: redis-sentinel
  ports:
  - name: sentinel
    port: 26379
    targetPort: 26379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  namespace: euro-office
spec:
  serviceName: redis-sentinel
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: redis-sentinel
  template:
    metadata:
      labels:
        app: redis-sentinel
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: sentinel
        image: valkey/valkey:8.1.12-alpine
        ports:
        - containerPort: 26379
          name: sentinel
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-sentinel-auth
              key: redis-password
        - name: SENTINEL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-sentinel-auth
              key: sentinel-password
        - name: SENTINEL_USER
          valueFrom:
            secretKeyRef:
              name: redis-sentinel-auth
              key: sentinel-user
        command:
        - sh
        - -c
        - |
          set -eu
          ns="$POD_NAMESPACE"
          fqdn="$HOSTNAME.redis-sentinel.$ns.svc.cluster.local"
          conf=/data/sentinel.conf

          # Ask another Sentinel for the current primary (used when this pod restarts
          # after a failover). Prints the host, or nothing.
          ask_sentinel() {
            if [ -n "$SENTINEL_PASSWORD" ]; then
              REDISCLI_AUTH="$SENTINEL_PASSWORD" timeout 3 redis-cli \
                -h "$1" -p 26379 SENTINEL get-master-addr-by-name mymaster 2>/dev/null | head -n 1
            else
              timeout 3 redis-cli -h "$1" -p 26379 SENTINEL get-master-addr-by-name mymaster 2>/dev/null | head -n 1
            fi
          }

          primary=""
          for i in 0 1 2; do
            peer="redis-sentinel-$i.redis-sentinel.$ns.svc.cluster.local"
            [ "$peer" = "$fqdn" ] && continue
            primary="$(ask_sentinel "$peer" || true)"
            [ -n "$primary" ] && break
          done
          [ -n "$primary" ] || primary="redis-node-0.redis-node.$ns.svc.cluster.local"

          # Sentinel rewrites its configuration file, so it lives in a writable volume.
          {
            echo "port 26379"
            echo "bind 0.0.0.0"
            echo "protected-mode no"
            echo "dir /data"
            echo "sentinel resolve-hostnames yes"
            echo "sentinel announce-hostnames yes"
            echo "sentinel announce-ip $fqdn"
            echo "sentinel monitor mymaster $primary 6379 2"
            echo "sentinel auth-pass mymaster $REDIS_PASSWORD"
            echo "sentinel down-after-milliseconds mymaster 5000"
            echo "sentinel failover-timeout mymaster 30000"
            echo "sentinel parallel-syncs mymaster 1"
            if [ -n "$SENTINEL_PASSWORD" ]; then
              # Sentinels authenticate to each other as the default user.
              echo "requirepass $SENTINEL_PASSWORD"
              echo "sentinel sentinel-pass $SENTINEL_PASSWORD"
              if [ -n "$SENTINEL_USER" ]; then
                # Minimal ACL of the DocumentServer's Sentinel client (node-redis 6.2.1,
                # checked with ACL LOG and a failover). It reads the topology
                # (SENTINEL MASTER/SENTINELS/REPLICAS), reports its library with
                # CLIENT SETINFO and subscribes to the Sentinel event channels.
                # AUTH needs no rule, no keys are used. A newer node-redis may need
                # more: look at `ACL LOG` on the Sentinels.
                # Commands: https://valkey.io/topics/sentinel/ ; ACL rules: https://valkey.io/topics/acl/
                echo "user $SENTINEL_USER on >$SENTINEL_PASSWORD resetchannels &switch-master &[-+]sdown &+slave &+sentinel &[-+]odown &+slave-reconf-done -@all +client|setinfo +sentinel|sentinels +sentinel|master +sentinel|replicas +psubscribe"
              fi
            fi
          } > "$conf"
          echo "starting sentinel $fqdn, monitoring $primary"
          exec redis-server "$conf" --sentinel
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - |
              if [ -n "$SENTINEL_PASSWORD" ]; then export REDISCLI_AUTH="$SENTINEL_PASSWORD"; fi
              redis-cli -h 127.0.0.1 -p 26379 SENTINEL get-master-addr-by-name mymaster | grep -q .
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            memory: 32Mi
            cpu: 25m
          limits:
            memory: 128Mi
            cpu: 250m
      volumes:
      - name: data
        emptyDir: {}
