{{- $redisModes := list "standalone" "sentinel" "cluster" -}}
{{- if and .Values.tests.enabled (or (has (default "memory" .Values.docservice.editorDataStorage) $redisModes) (has (default "memory" .Values.docservice.editorStatStorage) $redisModes)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ds.resources.name" (list . .Values.commonNameSuffix "test-redis-config") }}
  namespace: {{ include "ds.namespace" . | quote }}
  {{- if .Values.commonLabels }}
  labels:
    {{- include "ds.labels.commonLabels" . | trim | nindent 4 }}
  {{- end }}
data:
{{ (.Files.Glob "sources/scripts/test_redis_config.sh").AsConfig | indent 2 }}
{{- end }}
